# Render Blueprint: deploys the backend (Docker) and the frontend (static site).
# Dashboard -> New -> Blueprint -> pick this repo. Fill the `sync: false` values when prompted.
services:
  - type: web
    name: lyftr-chat-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false            # comma-separated, at least 2 keys
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false            # e.g. https://lyftr-chat.onrender.com
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_TYPE
        value: disk
    # On a paid plan, uncomment to keep SQLite + cache across deploys:
    # disk:
    #   name: app-data
    #   mountPath: /data
    #   sizeGB: 1

  - type: web
    name: lyftr-chat
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false            # e.g. https://lyftr-chat-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
